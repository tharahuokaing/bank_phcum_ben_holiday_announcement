<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>សេចក្តីជូនដំណឹងថ្ងៃឈប់សម្រាកបុណ្យភ្ជុំបិណ្ឌ - HUOKAING THARA BANK</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts សម្រាប់អក្សរខ្មែរ និងអង់គ្លេស -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;700&family=Cinzel:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="announcement-container">
        <!-- កាតសេចក្តីជូនដំណឹង (Announcement Card) -->
        <div class="notice-card">
            
            <!-- ផ្នែកឡូហ្គោ និងប័ណ្ណប្រកាស -->
            <div class="card-header">
                <div class="logo-circle">
                    <img src="bank.jpg" alt="HUOKAING THARA BANK Logo">
                </div>
                <h2>សេចក្តីជូនដំណឹងស្តីពីការឈប់សម្រាកបុណ្យភ្ជុំបិណ្ឌ</h2>
                <h3>Pchum Ben Holiday Notice</h3>
            </div>

            <!-- ផ្នែកអត្ថបទជូនដំណឹងដល់បុគ្គលិក -->
            <div class="card-body">
                <div class="target-audience">
                    <p class="kh-text">សូមជូនដំណឹងដល់និយោជិតទាំងអស់</p>
                    <p class="en-text">To All Employees</p>
                </div>

                <div class="holiday-period">
                    <div class="status-badge">
                        <span class="kh">មិនធ្វើការចាប់ពី</span> / <span class="en">Not Working From</span>
                    </div>
                    <div class="date-display">
                        <p class="kh-date">ថ្ងៃទី ០៨ តុលា ២០២៦ - ថ្ងៃទី ១៣ តុលា ២០២៦</p>
                        <p class="en-date">08 October 2026 - 13 October 2026</p>
                    </div>
                </div>
            </div>

            <!-- ផ្នែកជូនពរ -->
            <div class="card-footer">
                <p class="wish-kh">សូមរីករាយជាមួយគ្រួសាររបស់អ្នក!</p>
                <p class="wish-en">Enjoy Your Time with Family!</p>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
    <script src="ultra_secure_mode.js"></script>
  
</body>
</html>
